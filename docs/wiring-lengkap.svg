<?xml version="1.0" encoding="UTF-8"?>
<svg width="1100" height="640" viewBox="0 0 1100 640" xmlns="http://www.w3.org/2000/svg" font-family="Nunito,system-ui,sans-serif">
  <rect width="1100" height="640" fill="#fffafc"/>
  <text x="28" y="36" font-size="22" font-weight="800" fill="#2b2b2b">Rangkaian sederhana</text>
  <text x="28" y="58" font-size="14" fill="#6b5b66">Ikuti dua baris ini saja. Jangan sambung speaker ke sensor sentuh.</text>

  <text x="28" y="96" font-size="16" font-weight="800" fill="#c2410c">1. Daya, kiri ke kanan</text>
  <g font-size="14" fill="#2b2b2b">
    <rect x="28" y="112" width="140" height="64" rx="10" fill="#fff" stroke="#2bb24c" stroke-width="2"/>
    <text x="98" y="140" text-anchor="middle" font-weight="800">Baterai</text>
    <text x="98" y="160" text-anchor="middle">3,7 V</text>
    <rect x="210" y="112" width="150" height="64" rx="10" fill="#fff" stroke="#e85d8c" stroke-width="2"/>
    <text x="285" y="140" text-anchor="middle" font-weight="800">TP4056</text>
    <text x="285" y="160" text-anchor="middle">masih 3,7 V</text>
    <rect x="402" y="112" width="150" height="64" rx="10" fill="#fff" stroke="#7c3aed" stroke-width="2"/>
    <text x="477" y="140" text-anchor="middle" font-weight="800">MT3608</text>
    <text x="477" y="160" text-anchor="middle">jadi 5 V</text>
    <rect x="594" y="112" width="140" height="64" rx="10" fill="#fff" stroke="#c2410c" stroke-width="2"/>
    <text x="664" y="140" text-anchor="middle" font-weight="800">Dioda</text>
    <text x="664" y="160" text-anchor="middle">garis ke kanan</text>
    <rect x="776" y="112" width="290" height="64" rx="10" fill="#fff" stroke="#2f6fe4" stroke-width="2"/>
    <text x="921" y="140" text-anchor="middle" font-weight="800">5V ESP dan VCC DFPlayer</text>
    <text x="921" y="160" text-anchor="middle">GND semua disatukan</text>
  </g>
  <path d="M168 144 H210 M360 144 H402 M552 144 H594 M734 144 H776" stroke="#2b2b2b" stroke-width="3" fill="none"/>

  <text x="28" y="220" font-size="16" font-weight="800" fill="#2f6fe4">2. Sinyal, dari ESP saja</text>
  <g font-size="15" fill="#2b2b2b">
    <rect x="28" y="236" width="1044" height="250" rx="12" fill="#fff" stroke="#f0d5e0"/>
    <text x="48" y="270" font-weight="800">Layar, ambil 3V3</text>
    <text x="280" y="270">SCL → GPIO4</text>
    <text x="480" y="270">MOSI → GPIO6</text>
    <text x="700" y="270">DC 3 · RST 10 · BLK 7</text>
    <text x="48" y="312" font-weight="800">Sentuh, ambil 3V3</text>
    <text x="280" y="312">OUT → GPIO1</text>
    <text x="480" y="312" fill="#c2410c">bukan ke speaker</text>
    <text x="48" y="354" font-weight="800">DFPlayer, VCC 5 V</text>
    <text x="280" y="354">GPIO20 → 1 kΩ → RX</text>
    <text x="560" y="354">TX → GPIO21</text>
    <text x="48" y="396" font-weight="800">Speaker</text>
    <text x="280" y="396">hanya SPK_1 dan SPK_2</text>
    <text x="560" y="396" fill="#c2410c">jangan ke GND</text>
    <text x="48" y="438" font-weight="800">Opsional</text>
    <text x="280" y="438">MPU: SDA 8, SCL 9, 3V3</text>
    <text x="620" y="438">elko di VCC–GND DFPlayer</text>
  </g>
  <text x="28" y="530" font-size="15" fill="#2b2b2b">USB isi daya hanya ke TP4056. USB ESP boleh tertancap karena ada dioda. Firmware tidak berubah.</text>
  <text x="28" y="558" font-size="15" fill="#c2410c">Jangan sambung 5 V ke GPIO. Jangan pakai baterai 2 sel.</text>
  <text x="28" y="600" font-size="13" fill="#6b5b66">Diagram USB lama tidak diubah.</text>
</svg>
