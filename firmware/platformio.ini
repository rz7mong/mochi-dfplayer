; Mochi DFPlayer — ESP32-C3 + ST7789, suara lewat DFPlayer Mini (MP3), Chronos BLE.
; Bukan build MAX98357. Itu tetap di rz7mong/mochi-rzmong.
[env:esp32-c3-dfplayer]
platform = espressif32@6.9.0
board = esp32-c3-devkitm-1
framework = arduino
extra_scripts = pre:extra_script.py
monitor_speed = 115200
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
board_build.partitions = partitions.csv
board_build.flash_mode = dio
; Anggaran byte JPEG klip (lihat tools/embed_jpeg.py). App maks 0x3F0000 = 4.128.768 B,
; kode + BLE ±0,7 MB. Jika total klip melebihi angka ini, frame yang nyaris sama dipakai ulang saat build.
custom_jpeg_budget = 3300000
; Opsi tambahan, tulis di akhir build_flags bila perlu:
;   -DMOCHI_DF_COPY_ORDER        trek animasi = urutan salin di root kartu, bukan /MP3/000N.mp3
;   -DMOCHI_TOUCH_ACTIVE_HIGH    TTP223 bawaan pabrik (HIGH saat disentuh)
;   -DMOCHI_PIN_DF_BUSY=5        pin BUSY DFPlayer disambung ke GPIO5
;   -DMOCHI_DEFAULT_ROTATION=2   layar dipasang terbalik (pin di bawah)
; Chronos hanya butuh peran peripheral BLE: central/observer NimBLE dimatikan agar kode lebih kecil.
build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DUSER_SETUP_LOADED=1
  -include include/User_Setup_ST7789.h
  -I include
  -DCONFIG_BT_NIMBLE_ROLE_CENTRAL_DISABLED
  -DCONFIG_BT_NIMBLE_ROLE_OBSERVER_DISABLED
  -DCONFIG_BT_NIMBLE_LOG_LEVEL=0
  -DCONFIG_NIMBLE_CPP_LOG_LEVEL=0
lib_deps =
  bodmer/TFT_eSPI@2.5.43
  fbiego/ChronosESP32@1.9.1
  DFRobot/DFRobotDFPlayerMini@1.0.6
  bodmer/TJpg_Decoder@1.1.0
